<!DOCTYPE html>
<html>
    <head>
        <title>E-Ancestor</title>
        <meta charset="utf-8">
    </head>
    <body>
        <div id="main">
            <span id="an">👤</span>
            <input type="text" id="n" placeholder="Name of your ancestor here ...">
        </div>
        <input id="speed" type="range" min="-10" max="10" step="any" value="1">
    </body>
    <style>
        #an {
            font-size: 80px;
        }
    </style>
    <script>
        const mainDiv = document.getElementById("main");
        const anSpan = document.getElementById("an");   //ancestor
        const nInput = document.getElementById("n");    // name
        const speedInputRange = document.getElementById("speed");

        let deg = 0;
        setInterval(() => {
            mainDiv.style.transform = `rotate(${deg}deg)`;
            deg += speedInputRange.value;
        }, 100);
    </script>
</html>
