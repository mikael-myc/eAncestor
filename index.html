<!DOCTYPE html>
<html>
    <head>
        <title>E-Ancestor</title>
        <meta charset="utf-8">
    </head>
    <body>
        <div id="main">
            <ul>
                <li><span id="an">👤</span></li>
                <li><input type="text" id="n" placeholder="Name of your ancestor here ..."></li>
                <li><input id="speed" type="range" min="-10" max="10" step="any" value="1"></li>
            </ul>
        </div>
    </body>
    <style>
        :root{
            --an-width: min(50vw, 50vh);
        }
        #an {
            font-size: var(--an-width);
        }
        ul {
            list-style: none;
            text-align: center;
        }
        #speed {
            margin-top: 10px;
        }
        #n, #speed {
            width: var(--an-width);
        }
    </style>
    <script>
        const mainDiv = document.getElementById("main");
        const anSpan = document.getElementById("an");   //ancestor
        const nInput = document.getElementById("n");    // name
        const speedInputRange = document.getElementById("speed");

        let deg = 0;
        setInterval(() => {
            mainDiv.style.transform = `rotate(${deg}deg)`;
            deg += parseFloat(speedInputRange.value);
            if (deg > 360){
                deg -= 360;
            } else if (deg < -360){
                deg += 360;
            }
        }, 100);
    </script>
</html>
